<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{DOC_TITLE}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230B2327'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='%23E8B35C' font-family='Georgia'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@300;400;500;700&display=swap">
<style>
  :root{
    --night:#0B2327;--night-2:#0E2E33;--teal:#0F766E;--teal-2:#0D9488;--amber:#C2760A;--amber-2:#E8B35C;
    --ink:#17242D;--ink-soft:#53677A;--line:#E3E9E6;--surface:#F4F7F5;--bg:#FBFCfb;
    --serif:"Noto Serif SC",Georgia,"Songti SC",SimSun,serif;
    --sans:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.65;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:0 22px}
  a{color:var(--teal)}
  ::selection{background:rgba(15,118,110,.15)}

  /* ===== Nav ===== */
  .nav{position:sticky;top:0;z-index:50;background:rgba(251,252,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .nav .wrap{display:flex;align-items:center;gap:18px;height:52px}
  .nav-brand{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--teal-deep,#0B3B36);white-space:nowrap}
  .nav-links{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;justify-content:flex-start;min-width:0}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{font-size:12.5px;color:var(--ink-soft);padding:16px 8px 14px;white-space:nowrap;border-bottom:2px solid transparent;font-weight:500;text-decoration:none}
  .nav-links a:hover{color:var(--teal);border-bottom-color:var(--teal)}
  .nav-tag{font-size:11px;color:var(--amber-2);border:1px solid rgba(194,118,10,.4);padding:2px 8px;border-radius:99px;white-space:nowrap;background:rgba(194,118,10,.06);flex-shrink:0}

  /* ===== Hero ===== */
  .hero{background:linear-gradient(160deg,var(--night) 0%,var(--night-2) 55%,#14444f 100%);color:#EAF3F0;position:relative;overflow:hidden;display:flex;align-items:center;min-height:100vh}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(1200px 500px at 85% -10%,rgba(245,184,75,.14),transparent 60%),radial-gradient(900px 420px at -10% 110%,rgba(15,118,110,.35),transparent 60%);pointer-events:none}
  .hero .wrap{position:relative;padding-top:88px;padding-bottom:80px;width:100%}
  .hero-kicker{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;letter-spacing:.14em;color:#9FD8CE;font-weight:500}
  .hero-kicker::before{content:"";width:26px;height:2px;background:var(--amber-2);display:inline-block}
  .hero h1{font-family:var(--serif);font-weight:900;font-size:clamp(38px,6vw,66px);line-height:1.2;margin:26px 0 20px;letter-spacing:.01em}
  .hero h1 em{font-style:normal;color:var(--amber-2)}
  .hero-sub{font-size:clamp(16px,2.2vw,20px);color:#C9DCD7;max-width:680px}
  .hero-meta{display:flex;flex-wrap:wrap;gap:10px 26px;margin-top:36px;font-size:14px;color:#9FBDB6}
  .hero-meta b{color:#EAF3F0;font-weight:600}
  .stat-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:44px}
  .stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:20px 16px 16px;backdrop-filter:blur(4px)}
  .stat .n{font-family:var(--serif);font-weight:900;font-size:30px;color:var(--amber-2);line-height:1.1}
  .stat .t{font-size:13px;color:#BFD6D0;margin-top:6px;line-height:1.4}

  /* ===== Sections ===== */
  section{padding:30px 0 8px}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:20px}
  .sec-num{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--amber);letter-spacing:.08em}
  .sec-kicker{font-size:12.5px;font-weight:600;color:var(--teal);letter-spacing:.1em}
  .sec-kicker::before{content:"";display:inline-block;width:18px;height:1.5px;background:var(--teal);margin-right:8px;vertical-align:middle}
  .sec-title{font-family:var(--serif);font-weight:700;font-size:clamp(21px,3vw,28px);color:var(--ink);flex:1}
  .lede{margin-top:6px;color:var(--ink-soft);font-size:15px;max-width:860px}

  /* Cards */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px}
  .grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:0 1px 0 rgba(23,36,45,.03)}
  .card .tag{display:inline-block;font-size:11.5px;font-weight:600;color:var(--teal);background:rgba(15,118,110,.08);padding:3px 10px;border-radius:99px;margin-bottom:9px;letter-spacing:.02em}
  .card .tag.hot{color:#9A5A00;background:rgba(194,118,10,.12)}
  .card .t{font-weight:700;font-size:16px;margin-bottom:6px;color:var(--ink)}
  .card .body{font-size:13.5px;color:var(--ink-soft);line-height:1.6}

  /* Timeline */
  .timeline{margin-top:18px;border-top:1px solid var(--line)}
  .timeline{position:relative}
  .timeline::before{content:"";position:absolute;top:6px;bottom:6px;left:142px;width:2px;background:var(--line)}
  .tl-row{display:grid;grid-template-columns:120px 34px 1fr;gap:0 6px;padding-bottom:18px;border-bottom:1px solid var(--line)}
  .tl-time{font-family:var(--serif);font-weight:900;font-size:15px;color:var(--amber);line-height:1.9;text-align:right;padding-right:4px;letter-spacing:.02em}
  .tl-axis{position:relative}
  .tl-axis i{position:absolute;top:4px;left:50%;transform:translateX(-50%);width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px rgba(15,118,110,.12)}
  .tl-body .tl-t{font-weight:700;font-size:15px;color:var(--ink)}
  .tl-body .tl-d{font-size:13.5px;color:var(--ink-soft);margin-top:2px;line-height:1.6;max-width:760px}

  /* Quotes */
  .quotes{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:16px}
  .quote{background:linear-gradient(135deg,#0E2E33 0%,#103A40 100%);border-radius:14px;padding:20px 22px;color:#EAF3F0}
  .quote .q{font-family:var(--serif);font-size:16.5px;font-weight:600;line-height:1.6;color:#F6E3BE}
  .quote .q::before{content:"“";color:var(--amber-2);font-size:26px;vertical-align:-4px;margin-right:2px}
  .quote .note{margin-top:10px;font-size:12.5px;color:#9FD8CE;line-height:1.55}

  /* Callout */
  .callout{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:12px;padding:16px 20px;font-size:14px;color:var(--ink);line-height:1.7}
  .callout b{color:var(--teal)}
  .callout.amber{border-left-color:var(--amber);background:#FDF6E9}
  .callout.amber b{color:#9A5A00}

  footer{margin-top:26px;padding:20px 0 40px;border-top:1px solid var(--line)}
  footer .src{font-size:12px;color:var(--ink-soft);line-height:1.7;max-width:860px}

  /* ===== Responsive ===== */
  @media(max-width:980px){.stat-strip{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:860px){.grid3{grid-template-columns:repeat(2,1fr)}.nav-tag{display:none}}
  @media(max-width:640px){
    .grid3,.grid2{grid-template-columns:1fr}
    .quotes{grid-template-columns:1fr}
    .tl-row{grid-template-columns:84px 26px 1fr}
    .timeline::before{left:102px}
    .stat-strip{grid-template-columns:repeat(2,1fr);gap:8px}
    .stat .n{font-size:22px}
    .stat .t{font-size:12px}
    .hero{min-height:auto}
    .hero .wrap{padding-top:60px;padding-bottom:52px}
    .hero h1{font-size:clamp(30px,8vw,40px)}
    .sec-head{flex-wrap:wrap;gap:8px 12px}
    .card .body{font-size:14.5px}
    .card .tag{font-size:12px}
    .stat .t{font-size:12.5px}
    .quote .q{font-size:15.5px}
    .tl-d{font-size:14.5px}
    .hero-sub{font-size:14px}
  }
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
  :focus-visible{outline:2px solid var(--teal);outline-offset:2px}

  /* ===== Print ===== */
  @media print{
    @page{size:A4;margin:10mm 9mm 12mm}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    body{background:#fff;font-size:13px}
    .nav{display:none}
    .hero{min-height:auto;height:100vh;break-after:page}
    .hero .wrap{padding-top:64px;padding-bottom:58px}
    .hero h1{font-size:68px;margin:30px 0 22px;line-height:1.16}
    .hero-sub{font-size:20px;max-width:760px}
    .hero-meta{margin-top:32px;font-size:14.5px}
    .stat{padding:24px 16px 20px}
    .stat .n{font-size:36px}
    .stat .t{font-size:14px;margin-top:8px}
    .stat-strip{gap:12px;margin-top:40px;grid-template-columns:repeat(5,1fr)}
    section{padding:18px 0 4px}
    .sec-head{margin-bottom:12px;break-after:avoid}
    .lede{margin-top:6px}
    .card,.callout,.stat,.quote,.tl-row,.duo>*{break-inside:avoid}
    .grid3,.grid2{gap:9px;margin-top:10px}
    .card{padding:12px 14px}
    .quote{padding:14px 16px}
    .quotes{grid-template-columns:repeat(2,1fr);gap:10px}
    footer .src{break-inside:avoid}
  }
</style>
</head>
<body>

<!-- ===== Nav ===== -->
<nav class="nav"><div class="wrap">
  <span class="nav-brand">{{BRAND}}</span>
  <div class="nav-links">{{NAV_LINKS}}</div>
  <span class="nav-tag">AI 精要</span>
</div></nav>

<!-- ===== Hero ===== -->
<header class="hero"><div class="wrap">
  <div class="hero-kicker">{{HERO_KICKER}}</div>
  <h1>{{HERO_TITLE}}</h1>
  <p class="hero-sub">{{HERO_SUB}}</p>
  <div class="hero-meta">{{HERO_META}}</div>
  <div class="stat-strip">{{HERO_STATS}}</div>
</div></header>

<main>
{{SECTIONS}}
</main>

<footer><div class="wrap">
  <p class="src">{{FOOTER}}</p>
</div></footer>

</body>
</html>
